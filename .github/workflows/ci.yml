name: CI

on:
  pull_request:
  # Keep main verified too, so a green branch that goes stale is caught on merge.
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pushes to the same ref don't need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        # Before the slower steps: a formatting miss is the cheapest failure to
        # surface, and `bun run format` is the whole fix.
        run: bun run format:check
      - name: Type-check
        run: bun run check
      - name: Build
        run: bun run build
